{#get the base nav bar and layout}
{% extends 'base.html' %}

{% block content %}
<div class="'p-3">
    <div class="container"> 
        <div class="row mt-3">
            <div class="col mx-auto mb-3">
                <h2>Top Commenter</h2>
                <hr />

                {% if template_data.top_user %}
                <p><b>User:</b> {{ template_data.top_user }}</p>
                <p><b>Comments Posted:</b> {{ template_data.count }}</p>
                {% else %}
                    <p>No comments posted yet.</p>
                {% endif %}

            </div>
        </div>
    </div>
</div>
{% endblock content %}
