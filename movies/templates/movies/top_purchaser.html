{% extends 'base.html' %}

{% block content %}
<div class="'p-3">
    <div class="container"> 
        <div class="row mt-3">
            <div class="col mx-auto mb-3">
                <h2>Top Purchaser</h2>
                <hr />

                {% if template_data.max_user%}
                <p><b>User:</b> {{ template_data.max_user }}</p>
                <p><b>Movies Purchased:</b> {{ template_data.max_count}}</p>
                {% else %}
                <p>No purchases yet.</p>
                {% endif %}
                <hr />

            </div>
        </div>
    </div>
</div>
{% endblock content %}
